[package]
name = "helltime"
version = "0.2.1"
description = "Helltide reminder (desktop, later mobile)"
authors = ["you"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
image = "0.24"
